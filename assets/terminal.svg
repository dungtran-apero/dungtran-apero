<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="cyber terminal">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bb9af7"/><stop offset="50%" stop-color="#7dcfff"/><stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <clipPath id="screen"><rect x="14" y="44" width="452" height="242" rx="6"/></clipPath>
    <style>
      .bar{opacity:1}
      @keyframes t{0%{opacity:0;transform:translateX(-6px)}6%{opacity:1;transform:translateX(0)}86%{opacity:1}100%{opacity:0}}
      .bar{animation:t 7s infinite}
      .b1{animation-delay:.05s}.b2{animation-delay:.45s}.b3{animation-delay:.9s}.b4{animation-delay:1.35s}
      .b5{animation-delay:1.8s}.b6{animation-delay:2.25s}.b7{animation-delay:2.7s}.b8{animation-delay:3.15s}
      .b9{animation-delay:3.6s}.b10{animation-delay:4.05s}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(300px)}}
      .scan{animation:scan 4.5s linear infinite}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}
      .halo{animation:pulse 3.5s ease-in-out infinite}
    </style>
  </defs>

  <rect x="8" y="8" width="464" height="284" rx="12" fill="url(#glow)" class="halo"/>
  <rect x="10" y="10" width="460" height="280" rx="11" fill="#16161e"/>
  <rect x="10" y="10" width="460" height="34" rx="11" fill="#1f2335"/>
  <rect x="10" y="33" width="460" height="11" fill="#1f2335"/>
  <circle cx="30" cy="27" r="5.5" fill="#f7768e"/>
  <circle cx="50" cy="27" r="5.5" fill="#e0af68"/>
  <circle cx="70" cy="27" r="5.5" fill="#9ece6a"/>
  <text x="240" y="31" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#565f89" text-anchor="middle">~/dev — zsh</text>

  <g clip-path="url(#screen)">
    <rect x="14" y="44" width="452" height="242" fill="#1a1b26"/>

    <g class="bar b1"><rect x="30" y="62" width="10" height="9" rx="2" fill="#9ece6a"/><rect x="46" y="62" width="74" height="9" rx="2" fill="#7dcfff"/><rect x="126" y="62" width="120" height="9" rx="2" fill="#c0caf5"/></g>
    <g class="bar b2"><rect x="46" y="80" width="54" height="9" rx="2" fill="#bb9af7"/><rect x="106" y="80" width="98" height="9" rx="2" fill="#565f89"/></g>
    <g class="bar b3"><rect x="46" y="98" width="140" height="9" rx="2" fill="#7dcfff"/><rect x="192" y="98" width="46" height="9" rx="2" fill="#e0af68"/></g>
    <g class="bar b4"><rect x="62" y="116" width="86" height="9" rx="2" fill="#565f89"/><rect x="154" y="116" width="132" height="9" rx="2" fill="#c0caf5"/></g>
    <g class="bar b5"><rect x="62" y="134" width="112" height="9" rx="2" fill="#f7768e"/><rect x="180" y="134" width="64" height="9" rx="2" fill="#565f89"/></g>
    <g class="bar b6"><rect x="46" y="152" width="70" height="9" rx="2" fill="#bb9af7"/><rect x="122" y="152" width="156" height="9" rx="2" fill="#c0caf5"/></g>
    <g class="bar b7"><rect x="62" y="170" width="94" height="9" rx="2" fill="#7dcfff"/><rect x="162" y="170" width="78" height="9" rx="2" fill="#565f89"/></g>
    <g class="bar b8"><rect x="46" y="188" width="128" height="9" rx="2" fill="#9ece6a"/><rect x="180" y="188" width="52" height="9" rx="2" fill="#e0af68"/></g>
    <g class="bar b9"><rect x="30" y="212" width="10" height="9" rx="2" fill="#9ece6a"/><rect x="46" y="212" width="96" height="9" rx="2" fill="#bb9af7"/></g>
    <g class="bar b10"><rect x="46" y="230" width="166" height="9" rx="2" fill="#7dcfff"/></g>

    <rect x="30" y="252" width="10" height="9" rx="2" fill="#9ece6a"/>
    <rect x="46" y="251" width="8" height="11" fill="#c0caf5" class="cur"/>

    <g class="scan" opacity="0.5">
      <rect x="14" y="0" width="452" height="2" fill="#7dcfff" opacity="0.45"/>
      <rect x="14" y="2" width="452" height="34" fill="#7dcfff" opacity="0.05"/>
    </g>
  </g>
</svg>
